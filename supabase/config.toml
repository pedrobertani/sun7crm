project_id = "sun7crm"

# Chaves modernas: o gateway não valida sb_publishable, mas cada função exige JWT de sessão e usa Auth.getUser + autorização no banco.
[functions.crm-create-company]
verify_jwt = false

[functions.crm-create-user]
verify_jwt = false

[functions.crm-reset-password]
verify_jwt = false

[functions.crm-first-access]
verify_jwt = false

[functions.crm-update-company]
verify_jwt = false

# Checkout valida JWT de sessão; webhook exige HMAC e consulta autenticada ao provedor.
[functions.crm-billing-checkout]
verify_jwt = false

[functions.crm-billing-webhook]
verify_jwt = false

# Hom usa os mesmos handlers e força ambiente de pagamento de teste.
[functions.crm-billing-checkout-hom]
verify_jwt = false

[functions.crm-billing-webhook-hom]
verify_jwt = false

# FUTURO / INATIVO: bloqueio de login após 5 falhas em 15 minutos.
# O SQL está apenas em supabase/security/password-verification-hook.sql,
# deliberadamente fora de migrations. Não instalar, nem ativar no Free/Pro.
# A documentação atual do Supabase disponibiliza Password Verification Attempt
# em Team/Enterprise. Validar o plano e testar em homologação antes de mudar a flag.
[auth.hook.password_verification_attempt]
enabled = false
uri = "pg-functions://postgres/public/crm_password_verification_hook"
